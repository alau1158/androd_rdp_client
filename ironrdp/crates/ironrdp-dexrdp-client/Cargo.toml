[package]
name = "ironrdp-dexrdp-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "dexrdp_client"
crate-type = ["cdylib", "staticlib"]

[dependencies]
ironrdp-client = { path = "../ironrdp-client", features = ["rustls", "udp"] }
ironrdp-pdu = { path = "../ironrdp-pdu", features = ["std"] }
ironrdp-tls = { path = "../ironrdp-tls", features = ["rustls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
smallvec = "1"
jni = "0.21"

[lints]
workspace = true
