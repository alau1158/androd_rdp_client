[package]
name = "ironrdp-dexrdp-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "dexrdp_client"
crate-type = ["cdylib", "staticlib"]

[dependencies]
ironrdp-connector = { path = "../ironrdp-connector" }
ironrdp-session = { path = "../ironrdp-session" }
ironrdp-graphics = { path = "../ironrdp-graphics" }
ironrdp-dvc = { path = "../ironrdp-dvc" }
ironrdp-input = { path = "../ironrdp-input" }
ironrdp-pdu = { path = "../ironrdp-pdu", features = ["std"] }
ironrdp-core = { path = "../ironrdp-core", features = ["std"] }
ironrdp-rdpeudp = { path = "../ironrdp-rdpeudp", features = ["std"] }
ironrdp-rdpeudp-tokio = { path = "../ironrdp-rdpeudp-tokio", features = ["rustls-ring"] }
ironrdp-rdpemt = { path = "../ironrdp-rdpemt", features = ["std"] }
ironrdp-tokio = { path = "../ironrdp-tokio" }
ironrdp-tls = { path = "../ironrdp-tls", features = ["rustls-ring"] }
ironrdp-async = { path = "../ironrdp-async" }
sspi = { version = "0.21", features = ["network_client"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
jni = "0.21"

[lints]
workspace = true
