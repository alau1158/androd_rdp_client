[package]
name = "ironrdp-dexrdp-udp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "dexrdp_udp"
crate-type = ["cdylib", "staticlib"]

[dependencies]
ironrdp-rdpeudp-tokio = { path = "../ironrdp-rdpeudp-tokio", features = ["rustls-ring"] }
ironrdp-rdpeudp = { path = "../ironrdp-rdpeudp", features = ["std"] }
ironrdp-pdu = { path = "../ironrdp-pdu", features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[lints]
workspace = true
